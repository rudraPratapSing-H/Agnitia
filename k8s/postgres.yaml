apiVersion: v1
kind: Namespace
metadata:
  name: agnitia
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agnitia
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agnitia
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "shared_buffers=16MB"
        - "-c"
        - "max_connections=20"
        - "-c"
        - "restart_after_crash=off"
        env:
        - name: POSTGRES_PASSWORD
          value: "demo"
        resources:
          requests:
            memory: "32Mi"
          limits:
            memory: "64Mi"
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - 127.0.0.1
          initialDelaySeconds: 5
          periodSeconds: 5
