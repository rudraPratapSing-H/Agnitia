apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agnitia
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agnitia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: agnitia
spec:
  ports:
  - port: 80
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: agnitia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: app
        image: python:3.9-alpine
        command: ["/bin/sh", "-c"]
        args: ["python -m http.server 80"]
        readinessProbe:
          exec:
            command: ["nc", "-z", "postgres-0.postgres.agnitia.svc.cluster.local", "5432"]
          periodSeconds: 2
          failureThreshold: 1
---
