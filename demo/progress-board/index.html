<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agnitia • Live Progress Board (Checkpoint 1)</title>
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --done-color: #10B981;
      --done-bg: rgba(16, 185, 129, 0.12);
      --done-border: rgba(16, 185, 129, 0.35);

      --building-color: #F59E0B;
      --building-bg: rgba(245, 158, 11, 0.12);
      --building-border: rgba(245, 158, 11, 0.35);

      --next-color: #38BDF8;
      --next-bg: rgba(56, 189, 248, 0.12);
      --next-border: rgba(56, 189, 248, 0.35);

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      padding: 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header styling - readable at 1920x1080 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #38BDF8, #6366F1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .brand-titles h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand-titles p {
      font-size: 18px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .counter-pill {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .counter-label {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .counter-val {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .counter-val span.highlight {
      color: var(--done-color);
      font-size: 34px;
    }

    .progress-bar-container {
      width: 240px;
      height: 12px;
      background: #1E293B;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10B981, #38BDF8);
      border-radius: 6px;
      transition: width 0.6s ease;
      width: 33.3%;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(16, 185, 129, 0.08);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--done-border);
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background: var(--done-color);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--done-color);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Main Columns Grid */
    main.board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      flex: 1;
      align-items: start;
    }

    .column {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .column-title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .column-badge {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .column-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .col-done .column-badge { background: var(--done-color); box-shadow: 0 0 12px var(--done-color); }
    .col-done .column-title { color: var(--done-color); }

    .col-building .column-badge { background: var(--building-color); box-shadow: 0 0 12px var(--building-color); }
    .col-building .column-title { color: var(--building-color); }

    .col-next .column-badge { background: var(--next-color); box-shadow: 0 0 12px var(--next-color); }
    .col-next .column-title { color: var(--next-color); }

    .column-count {
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 10px;
      color: var(--text-main);
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 200px;
    }

    /* Individual Feature Card */
    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .feature-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .col-done .feature-card { border-left: 4px solid var(--done-color); }
    .col-building .feature-card { border-left: 4px solid var(--building-color); }
    .col-next .feature-card { border-left: 4px solid var(--next-color); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-id-tier {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-num {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .card-tier {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .card-owner {
      font-size: 16px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-detail {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: var(--text-dim);
      padding: 12px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sync-note {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Header with Brand & Global Counters -->
  <header>
    <div class="brand-group">
      <div class="brand-logo">A</div>
      <div class="brand-titles">
        <h1>Agnitia • Autonomous On-Call Platform</h1>
        <p>Execution Progress Board • Checkpoint 1 (Hour 5)</p>
      </div>
    </div>

    <div class="stats-group">
      <div class="counter-pill">
        <div class="counter-label">Velocity Tracker</div>
        <div class="counter-val" id="counterText">
          <span class="highlight" id="doneCount">7</span> of <span id="totalCount">21</span> features done
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <div class="live-status">
        <div class="pulse-dot"></div>
        <span>Live Sync (5s)</span>
      </div>
    </div>
  </header>

  <!-- 3-Column Board -->
  <main class="board-grid">

    <!-- Column 1: Done -->
    <section class="column col-done">
      <div class="column-header">
        <div class="column-title-group">
          <div class="column-badge"></div>
          <h2 class="column-title">Done</h2>
        </div>
        <div class="column-count" id="doneHeaderCount">0</div>
      </div>
      <div class="cards-container" id="doneCards"></div>
    </section>

    <!-- Column 2: Building Now -->
    <section class="column col-building">
      <div class="column-header">
        <div class="column-title-group">
          <div class="column-badge"></div>
          <h2 class="column-title">Building Now</h2>
        </div>
        <div class="column-count" id="buildingHeaderCount">0</div>
      </div>
      <div class="cards-container" id="buildingCards"></div>
    </section>

    <!-- Column 3: Next -->
    <section class="column col-next">
      <div class="column-header">
        <div class="column-title-group">
          <div class="column-badge"></div>
          <h2 class="column-title">Next (Checkpoint 2)</h2>
        </div>
        <div class="column-count" id="nextHeaderCount">0</div>
      </div>
      <div class="cards-container" id="nextCards"></div>
    </section>

  </main>

  <!-- Footer Info -->
  <footer>
    <div class="sync-note">
      <span>Auto-reloading from <code>status.json</code> every 5,000 ms</span>
    </div>
    <div id="lastUpdated">Updated just now</div>
  </footer>

  <script>
    // Renders a single feature card HTML
    function createCardHtml(item) {
      return `
        <div class="feature-card">
          <div class="card-top">
            <div class="card-id-tier">
              <span class="card-num">#${item.id}</span>
              <span class="card-tier">${item.tier || ''}</span>
            </div>
            <span class="card-owner">${item.owner}</span>
          </div>
          <div class="card-title">${item.name}</div>
          <div class="card-detail">${item.detail || ''}</div>
        </div>
      `;
    }

    // Fetches status.json and updates the DOM
    async function updateBoard() {
      try {
        const response = await fetch(`status.json?_t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        const doneItems = [];
        const buildingItems = [];
        const nextItems = [];

        data.forEach(item => {
          const state = (item.state || '').toLowerCase();
          if (state === 'done') doneItems.push(item);
          else if (state === 'building' || state === 'building now' || state === 'in_progress') buildingItems.push(item);
          else nextItems.push(item);
        });

        // Update counts
        const total = data.length;
        const done = doneItems.length;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        document.getElementById('doneCount').textContent = done;
        document.getElementById('totalCount').textContent = total;
        document.getElementById('progressBar').style.width = `${pct}%`;

        document.getElementById('doneHeaderCount').textContent = doneItems.length;
        document.getElementById('buildingHeaderCount').textContent = buildingItems.length;
        document.getElementById('nextHeaderCount').textContent = nextItems.length;

        // Render Cards
        document.getElementById('doneCards').innerHTML = doneItems.map(createCardHtml).join('');
        document.getElementById('buildingCards').innerHTML = buildingItems.map(createCardHtml).join('');
        document.getElementById('nextCards').innerHTML = nextItems.map(createCardHtml).join('');

        const now = new Date();
        document.getElementById('lastUpdated').textContent = `Last sync: ${now.toLocaleTimeString()}`;
      } catch (err) {
        console.warn('Status poll warning:', err);
      }
    }

    // Initial load and recurring 5-second poll
    updateBoard();
    setInterval(updateBoard, 5000);
  </script>
</body>
</html>
