<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agnitia · ReasoningPanel Dev Demo (Task 1.11)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #04070d;
      color: #e4e4e7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-[#04070d] text-zinc-100 min-h-screen flex items-center justify-center p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const AGENT_COLORS = {
      triage: {
        tag: '[TRIAGE]',
        border: 'border-purple-600/50',
        bg: 'bg-purple-950/40',
        text: 'text-purple-400',
      },
      diagnose: {
        tag: '[DIAGNOSE]',
        border: 'border-amber-600/50',
        bg: 'bg-amber-950/40',
        text: 'text-amber-400',
      },
      plan: {
        tag: '[PLAN]',
        border: 'border-cyan-600/50',
        bg: 'bg-cyan-950/40',
        text: 'text-cyan-400',
      },
      execute: {
        tag: '[EXECUTE]',
        border: 'border-indigo-600/50',
        bg: 'bg-indigo-950/40',
        text: 'text-indigo-400',
      },
      verify: {
        tag: '[VERIFY]',
        border: 'border-emerald-600/50',
        bg: 'bg-emerald-950/40',
        text: 'text-emerald-400',
      },
    };

    const formatTimestamp = (ts) => {
      if (!ts) {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
      }
      try {
        const d = new Date(ts);
        if (!isNaN(d.getTime())) {
          return d.toTimeString().split(' ')[0];
        }
      } catch {}
      return ts.length > 8 ? ts.slice(11, 19) : ts;
    };

    // =========================================================================
    // ReasoningPanel Component (Matching Task 1.11 Specification)
    // =========================================================================
    function ReasoningPanel({ steps = [], className = '' }) {
      const scrollContainerRef = useRef(null);
      const [userScrolledUp, setUserScrolledUp] = useState(false);
      const [typedCharCount, setTypedCharCount] = useState(0);
      const [typingStepIndex, setTypingStepIndex] = useState(-1);
      const timestampsRef = useRef([]);

      // Reset state when steps shrinks to []
      useEffect(() => {
        if (steps.length === 0) {
          setTypedCharCount(0);
          setTypingStepIndex(-1);
          setUserScrolledUp(false);
          timestampsRef.current = [];
        }
      }, [steps.length]);

      // Cache timestamps
      useEffect(() => {
        if (steps.length > timestampsRef.current.length) {
          for (let i = timestampsRef.current.length; i < steps.length; i++) {
            timestampsRef.current.push(formatTimestamp(steps[i].ts));
          }
        }
      }, [steps]);

      // Typing effect on the newest step only (approx 25ms per char)
      useEffect(() => {
        if (steps.length === 0) return;

        const newestIndex = steps.length - 1;
        const targetText = steps[newestIndex].text;

        if (typingStepIndex !== newestIndex) {
          setTypingStepIndex(newestIndex);
          setTypedCharCount(0);
          return;
        }

        if (typedCharCount < targetText.length) {
          const timer = setTimeout(() => {
            setTypedCharCount((prev) => Math.min(prev + 1, targetText.length));
          }, 25);
          return () => clearTimeout(timer);
        }
      }, [steps, typingStepIndex, typedCharCount]);

      // Auto-scroll to bottom unless user scrolled up
      useEffect(() => {
        if (!userScrolledUp && scrollContainerRef.current) {
          scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
        }
      }, [steps, typedCharCount, userScrolledUp]);

      const handleScroll = () => {
        if (!scrollContainerRef.current) return;
        const { scrollTop, scrollHeight, clientHeight } = scrollContainerRef.current;
        const isAtBottom = scrollHeight - scrollTop - clientHeight <= 35;
        setUserScrolledUp(!isAtBottom);
      };

      const handleJumpToLatest = () => {
        if (scrollContainerRef.current) {
          scrollContainerRef.current.scrollTo({
            top: scrollContainerRef.current.scrollHeight,
            behavior: 'smooth',
          });
          setUserScrolledUp(false);
        }
      };

      const isAnyRunning = steps.some((s) => s.status === 'running');

      return (
        <div className={`relative flex flex-col w-full h-[360px] min-h-[360px] max-w-[640px] bg-[#080c14] border border-zinc-800 rounded-xl overflow-hidden shadow-2xl font-mono ${className}`}>
          {/* Header */}
          <div className="flex items-center justify-between px-4 py-2.5 bg-[#0e1422] border-b border-zinc-850 select-none">
            <div className="flex items-center gap-2">
              <span className="w-3.5 h-3.5 rounded-full bg-rose-500/80 inline-block" />
              <span className="w-3.5 h-3.5 rounded-full bg-amber-500/80 inline-block" />
              <span className="w-3.5 h-3.5 rounded-full bg-emerald-500/80 inline-block" />
              <span className="ml-2 text-zinc-300 text-base font-semibold tracking-wide">
                terminal://agnitia/reasoning-engine
              </span>
            </div>
            <div>
              {isAnyRunning ? (
                <span className="flex items-center gap-1.5 px-2.5 py-0.5 text-base text-amber-400 bg-amber-950/60 border border-amber-800/60 rounded-full font-medium animate-pulse">
                  <span className="w-2 h-2 rounded-full bg-amber-400" />
                  RUNNING
                </span>
              ) : steps.length > 0 ? (
                <span className="px-2.5 py-0.5 text-base text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 rounded-full font-medium">
                  IDLE
                </span>
              ) : (
                <span className="px-2.5 py-0.5 text-base text-zinc-400 bg-zinc-900 border border-zinc-800 rounded-full">
                  STANDBY
                </span>
              )}
            </div>
          </div>

          {/* Terminal Body */}
          <div
            ref={scrollContainerRef}
            onScroll={handleScroll}
            className="flex-1 p-4 overflow-y-auto space-y-3.5"
          >
            {steps.length === 0 ? (
              <div className="flex items-center gap-2.5 text-zinc-500 text-base py-3">
                <span className="text-emerald-400 font-bold select-none text-base">❯</span>
                <span className="italic text-base">Waiting for incident...</span>
                <span className="w-2 h-5 bg-emerald-400/80 animate-pulse ml-1 inline-block" />
              </div>
            ) : (
              steps.map((step, index) => {
                const agentCfg = AGENT_COLORS[step.agent] || AGENT_COLORS.diagnose;
                const tsStr = timestampsRef.current[index] || formatTimestamp(step.ts);
                const isNewest = index === steps.length - 1;

                const displayText =
                  isNewest && typingStepIndex === index
                    ? step.text.slice(0, typedCharCount)
                    : step.text;

                const isCurrentlyTyping = isNewest && typedCharCount < step.text.length;

                return (
                  <div key={index} className="flex items-start text-base leading-relaxed tracking-normal">
                    {/* Prompt Glyph */}
                    <span className="text-emerald-400 font-bold mr-2 select-none text-base shrink-0">❯</span>
                    {/* Timestamp */}
                    <span className="text-zinc-500 mr-2.5 select-none text-base shrink-0">[{tsStr}]</span>
                    {/* Agent Tag */}
                    <span className={`px-1.5 py-0.5 rounded border text-base font-bold mr-2.5 select-none shrink-0 ${agentCfg.bg} ${agentCfg.border} ${agentCfg.text}`}>
                      {agentCfg.tag}
                    </span>
                    {/* Text & Indicators */}
                    <span className="text-zinc-100 text-base break-words font-mono flex-1">
                      {displayText}

                      {(step.status === 'running' || isCurrentlyTyping) && (
                        <span className="inline-block w-2.5 h-5 ml-1 bg-emerald-400 text-emerald-400 animate-pulse align-middle font-bold">▋</span>
                      )}

                      {step.status === 'done' && !isCurrentlyTyping && (
                        <span className="inline-flex items-center justify-center ml-2 text-emerald-400 font-bold text-base select-none">✓</span>
                      )}

                      {step.status === 'failed' && (
                        <span className="inline-flex items-center justify-center ml-2 text-rose-500 font-bold text-base select-none">✗</span>
                      )}
                    </span>
                  </div>
                );
              })
            )}
          </div>

          {/* Jump to latest floating button */}
          {userScrolledUp && steps.length > 0 && (
            <button
              onClick={handleJumpToLatest}
              className="absolute bottom-4 right-4 px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-base font-mono font-medium rounded-lg shadow-xl flex items-center gap-2 border border-emerald-400/40 cursor-pointer transition-all z-20"
            >
              <span>Jump to latest</span>
              <span className="text-lg">↓</span>
            </button>
          )}
        </div>
      );
    }

    // =========================================================================
    // Dev Demo Page Component
    // =========================================================================
    const MOCK_AGENT_STEPS = [
      {
        agent: 'triage',
        text: 'Grouping 56 alerts by dependency graph; identifying root candidate',
        ts: '2026-10-09T03:14:08.500Z'
      },
      {
        agent: 'diagnose',
        text: 'Reading last 50 log lines from postgres-0 container telemetry',
        ts: '2026-10-09T03:14:09.500Z'
      },
      {
        agent: 'diagnose',
        text: 'Found container lifecycle termination: Reason: OOMKilled, Exit Code: 137',
        ts: '2026-10-09T03:14:10.500Z'
      },
      {
        agent: 'diagnose',
        text: 'Memory curve analysis confirmed: memory peaked at 63.8Mi of 64Mi limit',
        ts: '2026-10-09T03:14:11.500Z'
      },
      {
        agent: 'plan',
        text: 'Synthesizing ordered recovery sequence: database before dependants',
        ts: '2026-10-09T03:14:12.500Z'
      },
      {
        agent: 'verify',
        text: 'Cross-referencing evidence citations: all citations match raw logs',
        ts: '2026-10-09T03:14:13.500Z'
      }
    ];

    function App() {
      const [steps, setSteps] = useState([]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1);
      const timerRef = useRef(null);

      const handleReset = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setIsPlaying(false);
        setSteps([]);
      };

      const startSimulation = () => {
        handleReset();
        setIsPlaying(true);

        let currentIdx = 0;

        const playStep = () => {
          if (currentIdx >= MOCK_AGENT_STEPS.length) {
            setIsPlaying(false);
            return;
          }

          const target = MOCK_AGENT_STEPS[currentIdx];

          // 1. First emit as 'running'
          setSteps((prev) => [
            ...prev,
            { agent: target.agent, text: target.text, status: 'running', ts: target.ts }
          ]);

          // 2. Transition to 'done' after 800ms
          timerRef.current = setTimeout(() => {
            setSteps((prev) => {
              const updated = [...prev];
              updated[updated.length - 1] = {
                ...updated[updated.length - 1],
                status: 'done'
              };
              return updated;
            });

            currentIdx++;
            // Next step
            timerRef.current = setTimeout(playStep, Math.max(300, 1000 / speed));
          }, Math.max(200, 800 / speed));
        };

        timerRef.current = setTimeout(playStep, 200);
      };

      // Check URL param ?demo=reasoning
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('demo') === 'reasoning') {
          startSimulation();
        }
      }, []);

      return (
        <div className="w-full max-w-[680px] flex flex-col items-center">
          {/* Header */}
          <div className="w-full flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
            <div>
              <h1 className="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                ReasoningPanel Dev Demo
              </h1>
              <p className="text-base text-zinc-400 mt-0.5">
                Replaying mock agent_step timeline · <code className="text-emerald-300">/?demo=reasoning</code>
              </p>
            </div>
            <div className="text-right">
              <span className="text-base text-zinc-500 block">Progress</span>
              <span className="text-xl font-bold text-zinc-200">{steps.length} / 6</span>
            </div>
          </div>

          {/* ReasoningPanel Terminal */}
          <div className="w-full h-[360px] my-2">
            <ReasoningPanel steps={steps} />
          </div>

          {/* Controls Toolbar */}
          <div className="w-full mt-4 p-4 bg-[#0a0f1d] border border-zinc-800 rounded-xl flex items-center justify-between flex-wrap gap-4">
            <div className="flex items-center gap-3">
              <button
                type="button"
                id="play-button"
                onClick={startSimulation}
                disabled={isPlaying}
                className={`px-4 py-2.5 rounded-lg text-base font-bold flex items-center gap-2 transition-all cursor-pointer ${
                  isPlaying
                    ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed border border-zinc-700'
                    : 'bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white shadow-lg border border-emerald-400/40'
                }`}
              >
                <span>▶</span>
                <span>{isPlaying ? 'Playing...' : 'Play Simulation'}</span>
              </button>

              <button
                type="button"
                id="reset-button"
                onClick={handleReset}
                className="px-4 py-2.5 rounded-lg text-base font-bold bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 text-zinc-200 border border-zinc-700 transition-all cursor-pointer flex items-center gap-2"
              >
                <span>↺</span>
                <span>Reset</span>
              </button>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-base text-zinc-400">Speed:</span>
              {[1, 2, 4].map((s) => (
                <button
                  key={s}
                  type="button"
                  onClick={() => setSpeed(s)}
                  className={`px-3 py-1.5 rounded-md text-base font-bold transition-all cursor-pointer ${
                    speed === s
                      ? 'bg-emerald-950 text-emerald-400 border border-emerald-600'
                      : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
                  }`}
                >
                  {s}x
                </button>
              ))}
            </div>
          </div>

          {/* Verification Checklist */}
          <div className="w-full mt-4 p-4 bg-[#080d1a] border border-zinc-850 rounded-lg text-base space-y-2">
            <div className="text-zinc-400 font-semibold mb-1">Task 1.11 Acceptance Criteria:</div>
            <div className="flex items-center gap-2 text-zinc-300">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>Terminal look: near-black bg, monospace, prompt glyph, colored tags ([TRIAGE]...[VERIFY])</span>
            </div>
            <div className="flex items-center gap-2 text-zinc-300">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>Typing effect: newest step types at ~25ms/char; earlier lines render instantly</span>
            </div>
            <div className="flex items-center gap-2 text-zinc-300">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>Auto-scroll to bottom; scroll-up pauses and shows "Jump to latest" button</span>
            </div>
            <div className="flex items-center gap-2 text-zinc-300">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>Empty state: "Waiting for incident..."; Reset button clears all cleanly</span>
            </div>
            <div className="flex items-center gap-2 text-zinc-300">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>Typography: no text under 16px; fits panel 600px × 360px</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
